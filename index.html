<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShareMap - Mini Messenger App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            box-sizing: border-box;
        }
        h2 { margin-top: 0; color: #38bdf8; font-size: 18px; text-align: center; }
        .btn {
            background-color: #0084FF;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            width: 100%;
            cursor: pointer;
            margin-bottom: 12px;
        }
        .btn:hover { background-color: #006bce; }
        .btn-success { background-color: #16a34a; }
        .btn-success:hover { background-color: #15803d; }
        .form-group { margin-bottom: 12px; text-align: left; }
        .form-group label { display: block; font-size: 12px; margin-bottom: 4px; color: #cbd5e1; }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #475569;
            border-radius: 6px;
            background-color: #0f172a;
            color: #ffffff;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }
        .form-group input:focus, .form-group textarea:focus { border-color: #38bdf8; }
        .log-box {
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            color: #38bdf8;
            height: 120px;
            overflow-y: auto;
            margin-bottom: 15px;
            text-align: left;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>💬 Mini Messenger App</h2>

        <!-- Step 1: Connect to Facebook Button -->
        <button class="btn" onclick="loginWithFacebook()">🔓 1. Connect to Facebook (Get Token)</button>

        <div class="form-group">
            <label>🔑 Active Page Access Token:</label>
            <input type="text" id="pageTokenInput" placeholder="Mag-login muna sa itaas..." readonly>
        </div>

        <hr style="border:0; border-top:1px solid #334155; margin:15px 0;">

        <!-- Step 2: Send Message Form -->
        <div class="form-group">
            <label>👤 Customer PSID (Messenger ID):</label>
            <input type="text" id="psidInput" placeholder="Ilagay ang PSID ng kustomer dito">
        </div>

        <div class="form-group">
            <label>✍️ Mensahe / Reply:</label>
            <textarea id="messageInput" rows="3" placeholder="I-type ang iyong reply dito..."></textarea>
        </div>

        <button class="btn btn-success" onclick="sendMessengerReply()">📤 2. I-send ang Reply sa Messenger</button>

        <div class="form-group" style="margin-top: 15px;">
            <label>📜 Activity Log (Parang TextView):</label>
            <div id="logBox" class="log-box">Handa na... Pindutin ang Connect to Facebook.</div>
        </div>
    </div>

    <!-- Facebook SDK Script -->
    <script>
        // Palitan ito ng iyong totoong Meta App ID mula sa Developers Console
        const FACEBOOK_APP_ID = "2070260990400834|4YFm1OoGhmFOJi82n10s6bmR3ho"; 

        window.fbAsyncInit = function() {
            FB.init({
                appId      : FACEBOOK_APP_ID,
                cookie     : true,
                xfbml      : true,
                version    : 'v26.0'
            });
        };

        (function(d, s, id){
            var js, fjs = d.getElementsByTagName(s)[0];
            if (d.getElementById(id)) {return;}
            js = d.createElement(s); js.id = id;
            js.src = "https://connect.facebook.net/en_US/sdk.js";
            fjs.parentNode.insertBefore(js, fjs);
        }(document, 'script', 'facebook-jssdk'));

        function logToScreen(text) {
            const box = document.getElementById("logBox");
            box.innerHTML += `> ${text}<br>`;
            box.scrollTop = box.scrollHeight;
        }

        function loginWithFacebook() {
            logToScreen("Humihingi ng pahintulot kay Meta...");
            
            // Subukan munang gamitin ang standard FB login o hilingin ang Page Token
            FB.login(function(response) {
                if (response.authResponse) {
                    const userAccessToken = response.authResponse.accessToken;
                    logToScreen("✅ Na-grant ang User Token! Kinukuha ang Page Access Token...");
                    
                    // Kunin ang mga Pages na pagmamay-ari para makuha ang Page Access Token
                    FB.api('/me/accounts', function(accountsResponse) {
                        if (accountsResponse && accountsResponse.data && accountsResponse.data.length > 0) {
                            // Kunin ang token ng unang page (o pwede nating piliin)
                            const page = accountsResponse.data[0];
                            document.getElementById("pageTokenInput").value = page.access_token;
                            logToScreen(`🎉 Tagumpay! Nakonekta sa Page: ${page.name}`);
                        } else {
                            logToScreen("⚠️ Walang nakitang Facebook Page sa account na ito.");
                        }
                    });
                } else {
                    logToScreen("❌ Kinansela o nabigo ang Facebook Login.");
                }
            }, {scope: 'pages_show_list, pages_messaging, pages_manage_metadata'});
        }

        async function sendMessengerReply() {
            const token = document.getElementById("pageTokenInput").value.trim();
            const psid = document.getElementById("psidInput").value.trim();
            const messageText = document.getElementById("messageInput").value.trim();

            if (!token) {
                alert("Paki-konekta muna ang Facebook account para makuha ang Page Token!");
                return;
            }
            if (!psid) {
                alert("Paki-lagay ang PSID ng kustomer!");
                return;
            }
            if (!messageText) {
                alert("Paki-lagay ang mensahe na ipapadala!");
                return;
            }

            logToScreen(`Ipinapadala ang mensahe kay PSID: ${psid}...`);

            const url = `https://graph.facebook.com/v26.0/me/messages?access_token=${encodeURIComponent(token)}`;
            
            const payload = {
                recipient: { id: psid },
                message: { text: messageText }
            };

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (result.recipient_id && result.message_id) {
                    logToScreen(`✅ Tagumpay na naipadala ang mensahe! (Message ID: ${result.message_id})`);
                    document.getElementById("messageInput").value = "";
                } else {
                    logToScreen(`❌ Error mula kay Meta: ${JSON.stringify(result)}`);
                }
            } catch (err) {
                logToScreen(`⚠️ Network Error: ${err.message}`);
            }
        }
    </script>
</body>
</html>
